# Human-maintained source of truth for querypie.com /ja redirects.
#
# - Keep page moves and bounded legacy route patterns in static_redirects.
# - Put one-off legacy aliases before broader parameterized rules.
# - Add content by source slug and the querypie.ai ID/slug in the matching family.
# - Family fallbacks preserve context for retired or unknown content.
# - final_fallback must remain last and sends any other /ja path to the Japanese home.
# - Run `npm run validate:ja-redirects` after editing to compare both live sitemaps.
version: 1
destination_origin: https://querypie.ai

