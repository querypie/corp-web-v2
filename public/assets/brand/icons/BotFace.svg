<svg width="88" height="88" viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- First animation from https://vin-jj.github.io/bot-test/bot.html: look around and blink. -->
  <style>
    .face { transform-origin: center; animation: activeRotate 4.5s ease-in-out infinite; }
    .features { animation: activeParallax 4.5s ease-in-out infinite; }
    .eyes { transform-origin: 44px 51.92px; animation: activeBlink 4s infinite; }
    @keyframes activeRotate {
      0%, 20%, 50%, 70%, 100% { transform: translateX(0) scaleX(1); }
      35% { transform: translateX(-11px) scaleX(0.82); }
      85% { transform: translateX(10px) scaleX(0.85); }
    }
    @keyframes activeParallax {
      0%, 20%, 50%, 70%, 100% { transform: translateX(0); }
      35% { transform: translateX(-9px); }
      85% { transform: translateX(6px); }
    }
    @keyframes activeBlink {
      0%, 90%, 100% { transform: scaleY(1); }
      93%, 97% { transform: scaleY(0.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .face, .features, .eyes { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="body" x1="1" y1="4" x2="87" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D3D6DB" />
      <stop offset="1" stop-color="#A0A2A5" />
    </linearGradient>
    <linearGradient id="screen" x1="16" y1="34" x2="73.5" y2="73.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#515151" />
      <stop offset="1" stop-color="#000000" />
    </linearGradient>
  </defs>
