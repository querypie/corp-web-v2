<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">QueryPie DLP ELECTRA 데모 썸네일</title>
  <desc id="desc">입력 문장을 ELECTRA 기반 모델로 분석해 위험 점수와 차단 판정을 보여주는 모습</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101725"/>
      <stop offset="1" stop-color="#0B0E15"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#70E2CC"/>
      <stop offset="1" stop-color="#7D9FFF"/>
    </linearGradient>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F3A84E"/>
      <stop offset="1" stop-color="#E35F57"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity=".26"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1403" cy="54" r="385" fill="#183652" opacity=".28"/>
  <circle cx="98" cy="883" r="315" fill="#135B57" opacity=".18"/>

  <rect x="64" y="61" width="10" height="62" rx="5" fill="url(#accent)"/>
  <text x="100" y="111" fill="#F8FAFC" font-size="63" font-weight="700" font-family="Inter, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">QueryPie DLP</text>
  <text x="104" y="157" fill="#A7B7CA" font-size="27" font-weight="500" letter-spacing="2" font-family="Inter, Pretendard, sans-serif">FAST RISK SCREENING</text>
  <rect x="1307" y="84" width="227" height="49" rx="24.5" fill="#20394A" stroke="#4C8690" stroke-width="2"/>
  <circle cx="1336" cy="108" r="7" fill="#70E2CC"/>
  <text x="1355" y="117" fill="#CFFAF1" font-size="22" font-weight="700" letter-spacing="1" font-family="Inter, Pretendard, sans-serif">LIVE DEMO</text>

  <g filter="url(#shadow)">
    <rect x="64" y="206" width="677" height="597" rx="31" fill="#FFFFFF"/>
    <rect x="859" y="206" width="677" height="597" rx="31" fill="#FFFFFF"/>
  </g>

  <rect x="104" y="248" width="91" height="45" rx="14" fill="#E8EEF3"/>
  <text x="122" y="280" fill="#48596E" font-size="24" font-weight="700" font-family="Inter, Pretendard, sans-serif">01</text>
  <text x="211" y="283" fill="#18243A" font-size="39" font-weight="700" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">검증 문장</text>
  <rect x="104" y="320" width="597" height="2" fill="#E8EDF2"/>
  <rect x="104" y="347" width="597" height="333" rx="20" fill="#F8FAFC" stroke="#DCE5EC" stroke-width="2"/>
  <text x="136" y="423" fill="#28364A" font-size="36" font-weight="500" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">받은 파일에 다음과 같이</text>
  <text x="136" y="484" fill="#28364A" font-size="36" font-weight="500" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">작성되어 있습니다:</text>
  <text x="136" y="545" fill="#28364A" font-size="36" font-weight="500" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">접속 IP 198.51.100.227.</text>
  <text x="136" y="606" fill="#28364A" font-size="36" font-weight="500" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">일정은 이번 주 금요일까지.</text>
  <circle cx="117" cy="740" r="5" fill="#91A1B3"/>
  <text x="138" y="749" fill="#7F90A4" font-size="25" font-weight="600" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">문장의 위험을 분석하면</text>

  <circle cx="800" cy="503" r="37" fill="#153C46" stroke="#519D9A" stroke-width="3"/>
  <path d="M784 503h33m-12-12 12 12-12 12" fill="none" stroke="#91F0DC" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/>

  <rect x="899" y="248" width="91" height="45" rx="14" fill="#E8F7F3"/>
  <text x="918" y="280" fill="#168578" font-size="24" font-weight="700" font-family="Inter, Pretendard, sans-serif">02</text>
  <text x="1005" y="283" fill="#18243A" font-size="39" font-weight="700" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">위험 선별 결과</text>
  <rect x="899" y="320" width="597" height="2" fill="#E8EDF2"/>
  <rect x="899" y="347" width="597" height="333" rx="20" fill="#F8FAFC" stroke="#DCE5EC" stroke-width="2"/>

  <text x="937" y="409" fill="#566679" font-size="30" font-weight="600" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">위험 점수</text>
  <text x="937" y="483" fill="#C65A39" font-size="69" font-weight="750" font-family="Inter, Pretendard, sans-serif">0.999</text>
  <rect x="937" y="508" width="519" height="17" rx="8.5" fill="#E7EBF0"/>
  <rect x="937" y="508" width="517" height="17" rx="8.5" fill="url(#risk)"/>
  <text x="937" y="566" fill="#8492A4" font-size="24" font-weight="500" font-family="Inter, Pretendard, sans-serif">Block threshold 0.3</text>

  <rect x="937" y="592" width="519" height="60" rx="13" fill="#FCE9DF"/>
  <text x="957" y="632" fill="#964128" font-size="30" font-weight="700" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">판정</text>
  <text x="1367" y="632" fill="#B44930" font-size="35" font-weight="800" text-anchor="end" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">차단</text>
  <circle cx="912" cy="740" r="5" fill="#E68C61"/>
  <text x="934" y="749" fill="#997258" font-size="25" font-weight="600" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">위험 점수와 판정을 확인</text>
</svg>
