name: corp-web-v2-ai-chat

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: querypie_ai_chat
      POSTGRES_USER: querypie
      POSTGRES_PASSWORD: querypie-local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ai-chat-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querypie -d querypie_ai_chat"]
      interval: 3s
      timeout: 3s
      retries: 20

  embeddings:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ai-chat-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ai-chat-postgres:
  ai-chat-ollama:
