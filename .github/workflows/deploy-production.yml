name: Deploy on Production

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: "Branch to Deploy"
        required: true
        default: "main"
        type: "string"

concurrency:
  group: production-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: scripts/deploy

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }} # querypie organization secret
      VERCEL_TEAM_ID: team_8DsCdrF1uCfwY30OS8F8lREn
      VERCEL_PROJECT_ID: prj_xeobCehIxv13fSJdlEprUfdqRlTd
      BRANCH: release
      TARGET_ENV: 'production'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Update release from source branch
        env:
          SOURCE_BRANCH: ${{ inputs.BRANCH }}
        run: |
          set -euxo pipefail
          git fetch --no-tags origin +refs/heads/release:refs/remotes/origin/release
          git fetch --no-tags origin "refs/heads/${SOURCE_BRANCH}"
          git push "--force-with-lease=refs/heads/release:$(git rev-parse refs/remotes/origin/release)" origin FETCH_HEAD:refs/heads/release

      - name: Run Deploy Script
        run: npm run deploy
