name: Deploy Main on Preview

permissions:
  contents: read

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

defaults:
  run:
    working-directory: scripts/deploy

concurrency:
  group: preview-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }} # querypie organization secret
      VERCEL_TEAM_ID: team_8DsCdrF1uCfwY30OS8F8lREn
      VERCEL_PROJECT_ID: prj_xeobCehIxv13fSJdlEprUfdqRlTd
      BRANCH: main
      TARGET_ENV: 'preview'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Deploy Script
        run: npm run deploy
